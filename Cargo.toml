[workspace]
resolver = "3"
members = ["crates/cli", "crates/lib"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishFire/concord"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
flate2 = "1"
plumb = { version = "0.12.4", registry = "perish", features = ["skill"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
toml = "0.9"
