[workspace]
resolver = "3"
members = ["crates/cli", "crates/lib"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishFire/concord"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
plumb = { version = "0.10.0", registry = "perish" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
