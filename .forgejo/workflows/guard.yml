name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Plumb
        uses: PerishLab/actions/setup-plumb@main

      - name: Install Ectropy
        uses: PerishLab/actions/setup-ectropy@main

      - name: Guard
        run: |
          set -eu
          deno run \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-net \
            --allow-run \
            --config .runseal/deno.json \
            --lock .runseal/deno.lock \
            --frozen=true \
            .runseal/wrappers/guard.ts

  windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust guard
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Manager single-option smoke
        run: pwsh -NoProfile -File manage.ps1 install --help
