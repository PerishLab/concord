[[boundary]]
allow = [
    "path",
    "comment",
]
note = "release infrastructure is guarded by its native format and syntax checks"
paths = [".forgejo/**"]

[[boundary]]
allow = ["word"]
note = "the GitHub GraphQL adapter preserves the provider wire dialect"
paths = ["crates/cli/src/dispatch/forge/github/mod.rs"]

[[boundary]]
allow = ["word"]
note = "the Issue search adapter preserves the GitHub GraphQL wire dialect"
paths = ["crates/cli/src/dispatch/forge/preflight/github.rs"]

[comment]
allow = false

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
    "crates/lib/src/runtime/build.rs",
    "crates/*/tests/**/*.rs",
    "crates/lib/src/runtime/config.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
]

[word]
single = true

