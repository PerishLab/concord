[[boundary]]
allow = [
    "path",
    "comment",
]
note = "release infrastructure is guarded by its native format and syntax checks"
paths = [".forgejo/**"]

[comment]
allow = false

[[grant]]
paths = [
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
    "crates/lib/src/runtime/build.rs",
    "crates/*/tests/**/*.rs",
    "crates/lib/src/runtime/config.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
]

[word]
single = true

