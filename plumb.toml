[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Concord CLI and protocol-kernel Rust workspace members."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = [".gitattributes"]
note = "Git attribute policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[release]
product = "concord"
authority = "https://releases.concord.perish.uk"
binaries = ["concord"]
skill = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[workflow.hash.guard]
"rust" = ["suite://cargo"]
"test" = ["*"]
"ectropy" = ["ectropy.toml", "crates", "skills"]
"plumb" = ["*"]
