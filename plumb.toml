[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Concord CLI and protocol-kernel Rust workspace members."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = [".gitattributes"]
note = "Git attribute policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[identity]
ns = "concord"

[release]
authority = "https://releases.concord.perish.uk"
binaries = ["concord"]
skill = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[workflow.hash.guard]
"rust" = ["suite://cargo"]
"test" = ["*"]
"ectropy" = ["plumb.toml", "crates"]
"plumb" = ["*"]

[windtun]
cases = ["context", "release"]
image = "ghcr.io/perishlab/images:stable"

[windtun.scenes]
authority = "https://depot.seatrial.perish.uk"
product = "seatrial"
channel = "stable"

[[ectropy.boundary]]
allow = ["shadow"]
note = "Concord's proof-neutral provider projection translates two externally owned Plumb plan types; retaining either external proof carrier would fabricate Guard evidence for native delivery"
paths = ["crates/lib/src/estate/work/delivery/model.rs"]

[[ectropy.grant]]
paths = [
    "crates/lib/src/runtime/build.rs",
    "crates/lib/src/runtime/config.rs",
    "crates/cli/src/runtime/config/legacy.rs",
]
syntax = "environment"

[[ectropy.grant]]
paths = [
    "crates/lib/src/runtime/build.rs",
]
syntax = "embed"
