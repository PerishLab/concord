[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Concord CLI and protocol-kernel Rust workspace members."

[[layout.seat]]
path = "charts/*"
kind = "retired"
note = "This product ships no Helm chart; the tombstone keeps the domain seat absent."

[[layout.seat]]
path = "skills/*"
kind = "retired"
note = "Concord carries no skill source; its generations are consumed from Depot through `concord skill`."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = [".gitattributes"]
note = "Git attribute policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Rust workspace anchors and the toolchain the distribution hub builds with."

[release]
product = "concord"
authority = "https://releases.concord.perish.uk"
binaries = ["concord"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[workflow.hash.guard]
"rust" = ["suite://cargo"]
"test" = ["*"]
"ectropy" = ["ectropy.toml", "crates", "skills"]
"plumb" = ["*"]
